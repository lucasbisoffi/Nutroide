<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criar Conta — Nutroide</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400,500,600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        suisse: {
                            bg: '#F8F7F4',
                            card: '#FFFFFF',
                            border: '#E3E1DA',
                            text: '#1C1B1A',
                            muted: '#706E6B',
                            accent: '#3B5336',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-suisse-bg text-suisse-text font-['Inter'] antialiased min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-suisse-card border border-suisse-border rounded-xl p-8 shadow-sm">
        
        <div class="mb-6 text-center">
            <h1 class="text-xl font-bold tracking-tight text-suisse-text">Nutroide</h1>
            <p class="text-xs text-suisse-muted tracking-wide uppercase mt-1">Criar novo perfil humano</p>
        </div>

        <form action="{{ url_for('register') }}" method="POST" class="space-y-4">
            <div>
                <label class="block text-xs font-medium uppercase tracking-wider text-suisse-muted mb-1.5">Nome</label>
                <input type="text" name="nome" required placeholder="Seu nome"
                    class="w-full bg-suisse-bg border border-suisse-border rounded-md px-3.5 py-2.5 text-sm focus:outline-none focus:border-suisse-accent transition-colors">
            </div>

            <div>
                <label class="block text-xs font-medium uppercase tracking-wider text-suisse-muted mb-1.5">E-mail</label>
                <input type="email" name="email" required placeholder="seu@email.com"
                    class="w-full bg-suisse-bg border border-suisse-border rounded-md px-3.5 py-2.5 text-sm focus:outline-none focus:border-suisse-accent transition-colors">
            </div>

            <div>
                <label class="block text-xs font-medium uppercase tracking-wider text-suisse-muted mb-1.5">Senha</label>
                <input type="password" name="senha" required placeholder="••••••••"
                    class="w-full bg-suisse-bg border border-suisse-border rounded-md px-3.5 py-2.5 text-sm focus:outline-none focus:border-suisse-accent transition-colors">
            </div>

            <button type="submit" class="w-full bg-suisse-text text-white text-sm font-medium py-2.5 rounded-md hover:bg-suisse-accent transition-colors mt-2">
                Cadastrar e Começar
            </button>
        </form>

        <p class="text-center text-xs text-suisse-muted mt-6">
            Já possui uma conta? 
            <a href="{{ url_for('login') }}" class="text-suisse-text font-medium underline hover:text-suisse-accent">Faça login</a>
        </p>
    </div>

</body>
</html>
