<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Nutroide - Registrar</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0b0b0b; color: #e0e0e0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .accent-wine { color: #720917; }
        .card-nutroide { background-color: #1a1a1a; border: 1px solid #720917; border-radius: 15px; }
        .btn-wine { background-color: #720917; color: white; border: none; }
        .btn-wine:hover { background-color: #a11225; }
        .form-control.bg-dark { background-color: #333; border-color: #444; color: white; }
        .form-control.bg-dark:focus { background-color: #333; border-color: #720917; color: white; box-shadow: 0 0 0 0.25rem rgba(114, 9, 23, 0.25); }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-md-6 col-lg-4">
                <div class="card-nutroide p-4">
                    <h2 class="text-center mb-4"><span class="accent-wine">Nutroide</span> Registro</h2>
                    <form action="/register" method="POST">
                        <div class="mb-3">
                            <label for="nome" class="form-label">Nome</label>
                            <input type="text" class="form-control bg-dark text-white" id="nome" name="nome" required>
                        </div>
                        <div class="mb-3">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" class="form-control bg-dark text-white" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="senha" class="form-label">Senha</label>
                            <input type="password" class="form-control bg-dark text-white" id="senha" name="senha" required>
                        </div>
                        <button type="submit" class="btn btn-wine w-100 mb-3">Registrar</button>
                        <p class="text-center">Já tem uma conta? <a href="/login" class="accent-wine text-decoration-none">Faça login aqui</a></p>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
